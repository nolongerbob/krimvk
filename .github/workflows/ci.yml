name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm run test -- --runInBand

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-test-secret-min-32-chars-long
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: test-and-build
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ci-test-secret-min-32-chars-long
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      - run: npx playwright install chromium --with-deps
      - run: npm run start &
        env:
          NEXTAUTH_SECRET: ci-test-secret-min-32-chars-long
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      - run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          exit 1
      - run: PLAYWRIGHT_SKIP_SERVER=1 npm run test:e2e
