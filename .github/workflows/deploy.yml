name: Prepare VPS release (no traffic switch)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Prepare target; does not deploy'
        required: true
        default: 'development'
        type: choice
        options:
          - production
          - development

concurrency:
  group: prepare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    steps:
      - name: Prepare isolated release over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SOURCE_DIR: ${{ inputs.target == 'production' && secrets.VPS_APP_DIR || secrets.VPS_APP_DIR_DEV }}
          RELEASE_BRANCH: ${{ inputs.target == 'production' && 'main' || 'develop' }}
          RELEASES_DIR: ${{ vars.RELEASES_DIR }}
          RELEASE_ENV_FILE: ${{ vars.RELEASE_ENV_FILE }}
          METER_SUBMISSION_DIR: ${{ vars.METER_SUBMISSION_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          envs: SOURCE_DIR,RELEASE_BRANCH,RELEASES_DIR,RELEASE_ENV_FILE,METER_SUBMISSION_DIR
          script_stop: true
          script: |
            set -euo pipefail
            test -n "$SOURCE_DIR"
            test -n "$RELEASES_DIR"
            test -n "$RELEASE_ENV_FILE"
            test -n "$METER_SUBMISSION_DIR"
            cd "$SOURCE_DIR"
            git fetch origin "$RELEASE_BRANCH"
            export RELEASE_REF="$(git rev-parse FETCH_HEAD)"
            PREPARE_DIR="$(mktemp -d /tmp/krimvk-prepare.XXXXXX)"
            git archive "$RELEASE_REF" scripts/deploy-vps.sh | tar -x -C "$PREPARE_DIR"
            bash "$PREPARE_DIR/scripts/deploy-vps.sh" --prepare
