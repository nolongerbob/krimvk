name: Deploy VPS

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'development') }}
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy production over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            chmod +x scripts/deploy-vps.sh
            export APP_NAME=krimvk
            export PORT=3000
            export DEPLOY_BRANCH=main
            export HEALTHCHECK_URL="${{ secrets.HEALTHCHECK_URL }}"
            ./scripts/deploy-vps.sh

  deploy-development:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'development')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development

    steps:
      - name: Deploy development over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR_DEV }}"
            chmod +x scripts/deploy-vps.sh
            export APP_NAME=krimvk-dev
            export PORT=3001
            export DEPLOY_BRANCH=develop
            export HEALTHCHECK_URL="${{ secrets.HEALTHCHECK_URL_DEV }}"
            ./scripts/deploy-vps.sh
