# Мониторинг: Prometheus + Grafana + экспортеры
# На VPS с 2 GB RAM: docker compose --profile core up -d
# Логи (Loki): docker compose --profile logs up -d  — только если есть запас RAM

services:
  prometheus:
    # quay.io — стабильнее скачивается с VPS в РФ, чем Docker Hub
    image: quay.io/prometheus/prometheus:v2.54.1
    profiles: ["core"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      - prometheus
    # host network: datasource http://127.0.0.1:9090 (UFW блокирует 172.17.0.1 из bridge)
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3030
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    profiles: ["core"]
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["core"]
    restart: unless-stopped
    network_mode: host
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?set POSTGRES_EXPORTER_DSN}

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.25.0
    profiles: ["core"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  loki:
    image: grafana/loki:3.2.1
    profiles: ["logs"]
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.2.1
    profiles: ["logs"]
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/www/krimvk/logs:/var/www/krimvk/logs:ro
    command: -config.file=/etc/promtail/config.yml

  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["uptime"]
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3002:3001"

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  uptime_kuma_data:
