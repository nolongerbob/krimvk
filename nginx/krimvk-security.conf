# Подключите в /etc/nginx/nginx.conf внутри блока http { }:
#   include /etc/nginx/conf.d/krimvk-security.conf;
#
# Или скопируйте: sudo cp nginx/krimvk-security.conf /etc/nginx/conf.d/

# Общий лимит (~10 req/s с IP, burst для страниц)
limit_req_zone $binary_remote_addr zone=krimvk_general:10m rate=10r/s;
# Логин / регистрация (~30 req/min)
limit_req_zone $binary_remote_addr zone=krimvk_auth:10m rate=30r/m;
# Подтверждение email: сканеры почты + опрос статуса (отдельно от login)
limit_req_zone $binary_remote_addr zone=krimvk_verify_email:10m rate=120r/m;
# Админ API
limit_req_zone $binary_remote_addr zone=krimvk_admin:10m rate=60r/m;

limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=krimvk_conn:10m;

# Скрыть версию nginx
server_tokens off;
