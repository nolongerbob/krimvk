<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>КрымВК — обновление сервиса</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #0f172a;
      background: linear-gradient(165deg, #eff6ff 0%, #f8fafc 45%, #ffffff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(37, 99, 235, 0.08), 0 1px 3px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
    }
    .logo {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #2563eb;
      margin-bottom: 1.5rem;
    }
    .icon {
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1.25rem;
      color: #2563eb;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.75rem;
      line-height: 1.4;
    }
    p {
      margin: 0;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #64748b;
    }
    .hint {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #f1f5f9;
      font-size: 0.8125rem;
      color: #94a3b8;
    }
    @media (prefers-reduced-motion: no-preference) {
      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo">КрымВК</div>
    <svg class="icon pulse" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.94m8.38-2.97-1.12-1.12a1.5 1.5 0 0 0-2.121 0l-1.12 1.12m4.242 4.242 1.12-1.12a1.5 1.5 0 0 0 0-2.121l-1.12-1.12m-4.242 4.242-1.12 1.12a1.5 1.5 0 0 1-2.121 0l-1.12-1.12" />
    </svg>
    <h1>Делаем сервис лучше для вас</h1>
    <p>Сайт временно недоступен — мы обновляем систему. Пожалуйста, зайдите чуть позже.</p>
    <p class="hint">Приносим извинения за неудобства.</p>
  </main>
</body>
</html>
